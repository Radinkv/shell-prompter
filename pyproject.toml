[project]
name = "shell-prompter"
version = "0.6.0"
description = "A natural-language shell agent powered by Claude, OpenAI, or Gemini."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "radinkv", email = "26397342+Radinkv@users.noreply.github.com" }]
keywords = ["cli", "shell", "ai", "agent", "llm", "anthropic", "openai", "gemini"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.0",
    "google-genai>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0", "twine>=5.0"]

[project.urls]
# Edit these to your repository before publishing.
Homepage = "https://github.com/Radinkv/shell-prompter"
Repository = "https://github.com/Radinkv/shell-prompter"

[project.scripts]
prompter = "prompter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prompter", "prompter.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
