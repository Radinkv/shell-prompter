[project]
name = "prompter"
version = "0.1.0"
description = "A natural-language shell agent powered by Claude."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
prompter = "prompter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prompter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
