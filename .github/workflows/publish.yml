name: Publish to PyPI

# Publishes shell-prompter to PyPI when you push a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI Trusted Publishing (OIDC) (no API token to store). One-time setup:
# on PyPI, open the project's "Publishing" settings and add a trusted publisher
# for this GitHub repo with workflow "publish.yml" and environment "pypi".

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ format('{0}{1}', 'py', 'pi') }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
